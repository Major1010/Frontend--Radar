<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Hangar Four4Three // Welcome</title>
  <meta name="description" content="Welcome to Hangar Four4Three — choose your experience.">

  <!-- Bree Serif (user specified) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { cursor: crosshair; }

    .cursor-dot {
      position: fixed; width: 6px; height: 6px; background: #7cfc00;
      border-radius: 50%; pointer-events: none; z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #7cfc00, 0 0 20px rgba(124,252,0,0.5);
    }
    .cursor-reticle {
      position: fixed; width: 30px; height: 30px;
      border: 1.5px solid rgba(124,252,0,0.75); pointer-events: none;
      z-index: 99998; transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out, border-color 0.2s;
    }

    #rain-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

    .landing-wrapper {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10; padding: 2rem; gap: 0;
    }

    .hangar-tag {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      font-weight: 600; letter-spacing: 0.35em;
      color: rgba(255,255,255,0.35); text-transform: uppercase;
      margin-bottom: 1.2rem;
      animation: fadeSlideDown 0.8s ease both; animation-delay: 0.1s;
    }

    .welcome-heading {
      font-family: "Bree Serif", serif; font-weight: 400; font-style: normal;
      font-size: clamp(2.2rem, 5.5vw, 5rem); line-height: 1.1; text-align: center;
      color: #fff;
      text-shadow: 0 0 40px rgba(255,255,255,0.15), 0 2px 0 rgba(0,0,0,0.8);
      margin-bottom: 0.4rem;
      animation: fadeSlideDown 0.9s ease both; animation-delay: 0.2s;
    }

    .welcome-sub {
      font-family: "Bree Serif", serif; font-weight: 400;
      font-size: clamp(1rem, 2.2vw, 1.7rem); text-align: center;
      color: rgba(255,255,255,0.45); margin-bottom: 3.2rem;
      animation: fadeSlideDown 0.9s ease both; animation-delay: 0.35s;
    }

    .choose-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(0.6rem, 1vw, 0.75rem); font-weight: 700;
      letter-spacing: 0.45em; color: rgba(255,255,255,0.22); text-transform: uppercase;
      margin-bottom: 2rem;
      animation: fadeSlideDown 0.9s ease both; animation-delay: 0.45s;
    }

    .buttons-row {
      display: flex; gap: 2rem; align-items: stretch;
      animation: fadeSlideUp 1s ease both; animation-delay: 0.5s;
    }

    .mode-btn {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem;
      width: clamp(210px, 22vw, 290px); min-height: 240px; padding: 1.8rem 1.5rem;
      border-radius: 8px; border: 1px solid transparent;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      cursor: pointer; text-decoration: none; color: inherit;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
        box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      position: relative; overflow: hidden;
    }

    .mode-btn:hover { transform: translateY(-7px) scale(1.035); }

    /* CALM */
    .mode-btn.calm-btn { border-color: rgba(160,210,255,0.22); }
    .mode-btn.calm-btn:hover {
      background: rgba(160,210,255,0.07); border-color: rgba(160,210,255,0.5);
      box-shadow: 0 20px 60px rgba(100,180,255,0.18), 0 0 0 1px rgba(160,210,255,0.28);
    }

    .calm-icon-wrap { display: flex; align-items: center; justify-content: center; width: 90px; height: 90px; }
    .peace-svg {
      width: 80px; height: 80px;
      filter: drop-shadow(0 0 12px rgba(140,200,255,0.5));
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .mode-btn.calm-btn:hover .peace-svg {
      filter: drop-shadow(0 0 24px rgba(140,200,255,0.9)); transform: rotate(15deg);
    }
    .calm-btn-label { font-family: "Bree Serif", serif; font-size: 1.35rem; color: #c8e6ff; letter-spacing: 0.04em; }
    .calm-btn-sub { font-family: 'Chakra Petch', sans-serif; font-size: 0.58rem; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(160,210,255,0.45); }

    /* MONSTER BUTTON */
    .mode-btn.monster-btn {
      border-color: rgba(79,208,80,0.22);
      background: rgba(255,255,255,0.04);
      padding: 1.5rem 1.4rem;
      justify-content: center;
    }
    .mode-btn.monster-btn:hover {
      background: rgba(79,208,80,0.06);
      border-color: rgba(79,208,80,0.55);
      box-shadow: 0 20px 60px rgba(79,208,80,0.25), 0 0 0 1px rgba(79,208,80,0.35);
    }

    .monster-img-logo {
      width: 100%;
      max-width: 165px;
      height: auto;
      max-height: 195px;
      object-fit: contain;
      display: block;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 14px rgba(79,208,80,0.65));
      transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .mode-btn.monster-btn:hover .monster-img-logo {
      filter: drop-shadow(0 0 30px rgba(79,208,80,1));
      transform: scale(1.06);
    }

    .landing-footer {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      font-family: 'Chakra Petch', sans-serif; font-size: 0.58rem; letter-spacing: 0.3em;
      color: rgba(255,255,255,0.12); text-transform: uppercase; z-index: 10; white-space: nowrap;
      animation: fadeSlideUp 1s ease both; animation-delay: 0.9s;
    }

    @keyframes fadeSlideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeSlideUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes pageExit      { to   { opacity:0; transform:scale(1.04); } }
    .page-exit { animation: pageExit 0.5s ease forwards; }

    @media (max-width: 600px) {
      .buttons-row { flex-direction: column; gap: 1.2rem; align-items: center; }
      .mode-btn { width: min(90vw, 340px); flex-direction: row; padding: 1.2rem 1.6rem; gap: 1.4rem; justify-content: center; }
      .mode-btn.monster-btn { justify-content: center; }
      .calm-icon-wrap { width: 60px; height: 60px; flex-shrink: 0; }
      .peace-svg { width: 55px; height: 55px; }
      .monster-img-logo { max-width: 140px; max-height: 120px; }
    }
  </style>
</head>
<body>

  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-reticle" id="cursor-reticle"></div>

  <canvas id="rain-canvas"></canvas>

  <div class="landing-wrapper" id="landing-wrapper">
    <div class="hangar-tag">// Universal Media Facility &middot; Port 443</div>
    <h1 class="welcome-heading">Welcome to Hangar Four4Three</h1>
    <p class="welcome-sub">Choose your experience</p>
    <div class="choose-label">&mdash; Select Mode &mdash;</div>

    <div class="buttons-row">

      <!-- CALM BUTTON — Peace sign -->
      <button class="mode-btn calm-btn" id="btn-calm" onclick="enterMode('calm')" type="button" aria-label="Enter Calm Mode">
        <div class="calm-icon-wrap">
          <svg class="peace-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="50" r="44" stroke="#a0d4ff" stroke-width="5"/>
            <line x1="50" y1="6" x2="50" y2="94" stroke="#a0d4ff" stroke-width="5" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="18" y2="80" stroke="#a0d4ff" stroke-width="5" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="82" y2="80" stroke="#a0d4ff" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="calm-btn-label">Calm</div>
        <div class="calm-btn-sub">Serene &middot; Minimal</div>
      </button>

      <!-- MONSTER BUTTON — Exact replica of official Monster Energy logo with M claw & text -->
      <button class="mode-btn monster-btn" id="btn-monster" onclick="enterMode('monster')" type="button" aria-label="Enter Monster Mode">
        <img src="/monster_energy.png" alt="Monster Energy" class="monster-img-logo">
      </button>

    </div>
  </div>

  <div class="landing-footer" id="landing-footer">Hangar Four4Three // All Systems Operational</div>

  <script>
    /* ===== CUSTOM CROSSHAIR CURSOR ===== */
    const cursorDot = document.getElementById('cursor-dot');
    const cursorReticle = document.getElementById('cursor-reticle');

    window.addEventListener('mousemove', (e) => {
      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top  = e.clientY + 'px';
      cursorReticle.style.left = e.clientX + 'px';
      cursorReticle.style.top  = e.clientY + 'px';
    });

    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('button, a, [role="button"]')) {
        cursorReticle.style.transform = 'translate(-50%, -50%) scale(1.7)';
        cursorReticle.style.borderColor = 'rgba(124,252,0,1)';
      } else {
        cursorReticle.style.transform = 'translate(-50%, -50%) scale(1)';
        cursorReticle.style.borderColor = 'rgba(124,252,0,0.75)';
      }
    });

    /* ===== RAIN BACKGROUND ===== */
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let drops = [];
    const FS = 14;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      const cols = Math.floor(canvas.width / FS);
      drops = [];
      for (let i = 0; i < cols; i++) drops[i] = Math.random() * -(canvas.height / FS);
    }

    const CHARS = '|¦│╎ᛁ丨 ╷╵╹╻│ ╽╿ ||||||||'.split('');

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.055)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = FS + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const d = i % 3;
        ctx.fillStyle = d === 0 ? 'rgba(30,80,30,0.88)'
                      : d === 1 ? 'rgba(20,55,20,0.65)'
                                : 'rgba(60,160,60,0.93)';
        if (drops[i] > 0 && Math.random() > 0.97) ctx.fillStyle = 'rgba(130,255,100,1)';
        ctx.fillText(CHARS[Math.floor(Math.random() * CHARS.length)], i * FS, drops[i] * FS);
        if (drops[i] * FS > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 0.42 + Math.random() * 0.3;
      }
    }

    window.addEventListener('resize', resize);
    resize();
    setInterval(draw, 40);

    /* ===== MODE SELECTION + REDIRECT ===== */
    function enterMode(mode) {
      try {
        localStorage.setItem('ymd_ui_mode', mode);
        localStorage.setItem('ymd_mode_chosen', 'true');
      } catch(e) {}
      document.getElementById('landing-wrapper').classList.add('page-exit');
      document.getElementById('landing-footer').classList.add('page-exit');
      setTimeout(() => { window.location.href = '/app?mode=' + mode; }, 480);
    }
  </script>
</body>
</html>
